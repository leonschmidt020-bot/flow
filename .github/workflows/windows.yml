# Flow for Windows – build, test, package. Only runs when windows/** changes (or on a release tag).
name: windows

on:
  push:
    branches: ['**']
    tags: ['windows-v*']   # Mac-Versionen nutzen v* – die sollen keinen Windows-Build auslösen
    paths: ['windows/**', '.github/workflows/windows.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: write # needed to publish GitHub Releases on tags

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: windows

jobs:
  windows:
    name: Windows x64 – lint, tests, ASR, installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      FLOW_MODEL_CACHE: ${{ github.workspace }}\windows\.cache\models
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint + typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: windows/.cache/models
          key: flow-models-${{ runner.os }}-${{ hashFiles('windows/src/asr/models.ts', 'windows/src/meeting/diarizer.ts') }}

      - name: ASR test (Parakeet v3, synthetic DE/EN speech)
        run: npm run test:asr

      - name: Notetaker test (Parakeet + sherpa-onnx diarization, synthetic two-voice meeting)
        run: npm run test:meeting

      - name: Build app
        run: npm run build

      - name: Smoke test (Electron main + ASR + hub + notetaker import, no hotkey/mic/clipboard)
        timeout-minutes: 6
        shell: pwsh
        run: |
          $env:FLOW_MODEL_DIR = "$env:FLOW_MODEL_CACHE"
          $env:FLOW_SMOKE_OUT = "$PWD\.cache\render"
          $env:FLOW_NO_FFMPEG = "1"   # exercise Electron's built-in decoder for the m4a import
          npx electron . --smoke=test/fixtures/asr/de_meeting.wav --meeting-selftest=test/fixtures/meeting/two_voices.m4a
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Render check (offscreen PNGs)
        run: npx electron . --render-check=.cache/render

      - name: Package installer (NSIS)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npx electron-builder --config electron-builder.config.cjs --win --x64 --publish never

      - name: Package + publish to GitHub Releases
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --config electron-builder.config.cjs --win --x64 --publish always

      - name: Check packaged native modules (koffi, uiohook, sherpa)
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = "1"
          & "release/win-unpacked/Flow.exe" scripts/check-packaged.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Flow-Setup-windows-x64
          path: |
            windows/release/*.exe
            windows/release/*.blockmap
            windows/release/latest.yml
          if-no-files-found: error

      - name: Upload renders + ASR results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flow-windows-checks
          path: |
            windows/.cache/render/*.png
            windows/.cache/asr-results-*.json
            windows/.cache/meeting-results.json
          if-no-files-found: ignore

  macos:
    name: macOS – unit tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - run: npm test
