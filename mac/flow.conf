# Flow für macOS – die EINE Stelle für die Update-Quelle.
# install-mac.sh klont von hier, update.sh / der Updater in der App folgen danach dem Git-„origin“ des Klons.
# Vor der Veröffentlichung FLOW_REPO_URL auf das echte öffentliche Repo setzen (und dieselbe Zeile in
# install-mac.sh › FLOW_REPO_URL_DEFAULT – das Release-Tor prüft, dass beide gleich sind).
FLOW_REPO_URL="https://github.com/leonschmidt020-bot/flow.git"
# Kanal = Branch, dem die App folgt. Für Nutzer: main (nur geprüfte Stände landen dort).
FLOW_CHANNEL="main"
